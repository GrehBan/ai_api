
[project]
name = "ai-api"
dynamic = ["version"]
description = "Asynchronous Python API client library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "GrehBan", email = "57055685+GrehBan@users.noreply.github.com" },
]
dependencies = [
    "aiodns>=4.0.4",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "brotli>=1.2.1",
    "certifi>=2026.10.23",
    "multidict>=7.2.1",
    "orjson>=3.13.0",
    "pydantic>=2.14.1",
    "tenacity>=9.2.1",
    "typing-extensions>=4.16.0",
    "yarl>=1.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ai_api/__meta__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_api"]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.3",
    "types-aiofiles>=25.1.0.20260518",
    "types-jsonschema>=4.26.0.20261006",
]
test = [
    "aresponses>=3.0.0",
    "jsonschema>=4.25",
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.17.0",
    "pytest-mypy>=1.1.0",
    "trustme>=1.2.1",
]

[tool.ruff]
line-length = 79
target-version = "py313"
src = ["src"]
extend-exclude = [
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "dev",
    "scripts",
    "*.egg-info",
]


[tool.ruff.lint]
select = [
    # "C", # TODO: mccabe - code complecity
    "A", # flake8-annotations
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "PERF", # perflint
    "PL", # pylint
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP", # pyupgrade
]
ignore = [
    "A002",
    "A005",
    "B008",
    "PLC0415",
    "PLC1901",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR6301",
    "PLW2901",
    "PLW3201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D", # docstrings are not required in tests
    "PLR2004", # magic values are expected in asserts
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ai_api"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: tests against a local aiohttp server",
    "typing: static type checks",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ai_api"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 98
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.mypy]
plugins = "pydantic.mypy"
python_version = "3.13"
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# mypy is the source of truth; these pyright-only diagnostics are disabled.
# isinstance() narrowing of Any values (JSON bodies, request payloads)
# yields partially unknown types such as dict[Unknown, Unknown].
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
