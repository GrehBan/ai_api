name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pyright
      - run: uv run pytest --mypy -m mypy tests/typing
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  test-matrix:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every CPython the package supports (requires-python >= 3.13);
        # 3.13, the oldest, is also what .python-version pins locally.
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked --python ${{ matrix.python }}
      - run: >-
          uv run pytest --cov --cov-branch --cov-report=xml
          --html=report.html --self-contained-html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            report.html

  tests:
    # One stable name for the branch ruleset, whatever the matrix holds.
    name: tests
    if: always()
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv --python 3.13 .wheel-env
          uv pip install --python .wheel-env dist/*.whl
          .wheel-env/bin/python - <<'EOF'
          from importlib.metadata import version

          import ai_api
          import ai_api.providers.anthropic
          import ai_api.providers.openai

          assert ai_api.__version__ == version("ai-api"), (
              ai_api.__version__,
              version("ai-api"),
          )
          print("ai-api", ai_api.__version__, "imports from its wheel")
          EOF

  changelog:
    # A pull request adds a fragment to CHANGES/ (or, for a release,
    # changes CHANGELOG.md itself); the "no changelog" label skips the
    # check for a change no user sees.
    name: changelog
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: >-
          uv run --locked --only-group dev
          towncrier check --compare-with origin/${{ github.base_ref }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Known vulnerabilities in every locked dependency, dev tools too.
      # An exception is an --ignore <ID> with its reason in a comment
      # (rule, reason, scope, owner, review condition: manifest §18).
      - run: uv audit --locked --preview-features audit-command
